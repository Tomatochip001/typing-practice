<style>
/* Layout: one practice desk — mode rail on top, the stage is the only framed object, records sit below as plain ruled sections */
:root{
  --bg:#e8ecf0; --panel:#fbfcfd; --ink:#17212c; --muted:#5a6776; --line:#cdd5de;
  --accent:#3346c9; --accent-soft:#dde2fb; --on-accent:#ffffff;
  --ok:#1d8556; --bad:#c3372c; --heat:#d2452f;
  --cur-bg:#ffe27a; --cur-fg:#17212c;
  --f-display:"DotGothic16","M PLUS 1 Code",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-mono:"M PLUS 1 Code","Consolas","Menlo",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#171e28; --ink:#e5eaf0; --muted:#94a1b1; --line:#2b3644;
  --accent:#8b98ff; --accent-soft:#262f5a; --on-accent:#0f141b;
  --ok:#4fc58d; --bad:#ff6f61; --heat:#ff7a5c; --cur-bg:#5b4a10; --cur-fg:#fff3c4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#171e28; --ink:#e5eaf0; --muted:#94a1b1; --line:#2b3644;
  --accent:#8b98ff; --accent-soft:#262f5a; --on-accent:#0f141b;
  --ok:#4fc58d; --bad:#ff6f61; --heat:#ff7a5c; --cur-bg:#5b4a10; --cur-fg:#fff3c4; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:36px;margin:0;line-height:1;letter-spacing:.06em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:7px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;margin-left:6px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.danger{color:var(--bad)}
#customBox{display:flex;flex-direction:column;gap:8px}
#customText{font-family:var(--f-mono);font-size:14px;width:100%;min-height:130px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);resize:vertical}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-height:340px;display:flex;flex-direction:column;gap:14px;outline:none}
.stage:focus-visible,.stage:focus{box-shadow:0 0 0 3px var(--accent-soft)}
.hud{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:baseline;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud span{display:inline-flex;align-items:baseline;gap:6px}
.hud b{color:var(--ink);font-size:20px;font-family:var(--f-display);font-weight:400}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}
.warn{background:var(--bad);color:var(--on-accent);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700}
#body{min-width:0}
.code{font-family:var(--f-mono);font-size:17px;line-height:1.8;white-space:pre;overflow-x:auto;margin:0;padding:6px 2px}
.done{color:var(--ok)}
.retry-tag{align-self:flex-start;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px;margin-bottom:2px;display:inline-block}
.done .ng{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.rest{color:var(--muted)}
.cur{background:var(--cur-bg);color:var(--cur-fg);border-radius:3px;box-shadow:0 2px 0 var(--accent)}
.flash .cur{background:var(--bad);color:var(--on-accent);box-shadow:none}
.jp-text{font-size:27px;font-weight:700;line-height:1.5;text-wrap:balance;margin:6px 0 0}
.jp-kana{font-size:17px;color:var(--muted);margin:0}
.jp-roma{font-family:var(--f-mono);font-size:21px;letter-spacing:.02em;word-break:break-all;margin:4px 0 0}
.next{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.ime-target{font-size:25px;line-height:1.7;font-weight:700;margin:6px 0 0}
.ime-target .ok{color:var(--ok)}
.ime-target .ng{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.ime-target .rest{color:var(--ink);opacity:.55}
#imeInput{font:inherit;font-size:20px;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#imeInput:focus{outline:none;border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg);color:var(--ink)}
.result{display:flex;flex-direction:column;gap:16px}
.rank{font-family:var(--f-display);font-size:15px;color:var(--accent);letter-spacing:.1em}
.r-main{display:flex;flex-wrap:wrap;gap:12px 40px;align-items:flex-end}
.r-main div{display:flex;flex-direction:column}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.big{font-family:var(--f-display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-family:var(--f-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.unit{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg)}
.chip b{color:var(--bad);font-weight:600;margin-right:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
/* records */
.rec{display:flex;flex-direction:column;gap:28px}
.sec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.sec h2{font-size:16px;margin:0;font-weight:700}
.rec-grid{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:780px){.rec-grid{grid-template-columns:3fr 2fr}}
.chart{position:relative;min-height:220px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;color:var(--ink)}
.tip b{font-family:var(--f-display);font-weight:400;font-size:16px}
.empty{color:var(--muted);font-size:14px;padding:30px 0}
.weak-list{display:flex;flex-direction:column;gap:6px}
.wk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.wk .k{font-family:var(--f-mono);font-size:16px;border:1px solid var(--line);border-radius:6px;text-align:center;background:var(--bg)}
.wk .m{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.wk .m i{display:block;height:100%;background:var(--heat)}
.wk .v{color:var(--muted)}
.kb-wrap{overflow-x:auto;padding-bottom:4px}
.kb{display:flex;flex-direction:column;gap:4px;width:max-content}
.kb .row{display:flex;gap:4px}
.key{width:38px;height:38px;flex:none;border-radius:6px;border:1px solid var(--line);font-family:var(--f-mono);font-size:14px;position:relative;cursor:default;color:var(--ink)}
.key .b{position:absolute;left:6px;top:3px}
.key .s{position:absolute;right:5px;bottom:2px;font-size:10px;opacity:.7}
.key.few{border-style:dashed;color:var(--muted)}
.key:hover{outline:2px solid var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:400;font-size:12px}
/* account */
.acct{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:-8px}
.acct .who{color:var(--ink);font-weight:700}
.acct .err{color:var(--bad)}
.btn.sm{font-size:13px;padding:3px 11px}
/* モーダルにしない: showModal() だと外側が inert になり、パスワード管理の拡張機能(iCloudパスワード等)が
   ページに重ねるボタンをクリックできず、入力欄の外クリック扱いで自動入力の有効化が中断される。
   背景の暗さは box-shadow で作る(クリックを受けないので拡張機能のUIを邪魔しない) */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px 24px;width:min(92vw,400px)}
#authDlg{position:fixed;inset:0;margin:auto;height:fit-content;max-height:92vh;overflow:auto;z-index:1000;box-shadow:0 0 0 100vmax rgba(10,16,24,.55)}
dialog h2{margin:0 0 12px;font-size:18px}
.seg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:14px}
.seg button{flex:1;font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:5px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.fld input[type=text],.fld input[type=password]{font:inherit;font-size:16px;font-family:var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.fld input:focus{outline:2px solid var(--accent);outline-offset:1px}
.captcha{min-height:65px;margin-bottom:10px}
.dlg-msg{min-height:1.4em;font-size:13px;color:var(--bad);margin:2px 0 10px}
.dlg-note{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.55}
@media (max-width:520px){.jp-text{font-size:22px}.big{font-size:52px}.code{font-size:15px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>打鍵道場</h1>
      <p>コードとAIプロンプトを、速く正確に打つための練習場</p>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-mode="code">コード</button>
      <button role="tab" data-mode="roma">ローマ字</button>
      <button role="tab" data-mode="ime">IME変換</button>
      <button role="tab" data-mode="weak">苦手特訓</button>
      <button role="tab" data-mode="rec">記録</button>
    </nav>
  </header>
  <div class="acct" id="acct" hidden></div>

  <section id="play" style="display:flex;flex-direction:column;gap:14px">
    <div class="controls" id="ctl-code">
      <label>言語<select id="selCode">
        <option value="cs">C# (Unity)</option><option value="py">Python</option><option value="js">JavaScript</option>
        <option value="sym">記号ラッシュ</option><option value="custom">自作コード</option></select></label>
      <label class="chk"><input type="checkbox" id="optIndent" checked> インデントを自動で入力</label>
    </div>
    <div class="controls" id="ctl-roma">
      <label>お題<select id="selRoma">
        <option value="prompt">AIプロンプト</option><option value="daily">日常・連絡</option><option value="mix">ミックス</option></select></label>
      <label class="chk"><input type="checkbox" id="optGuide" checked> ローマ字ガイドを表示</label>
    </div>
    <div class="controls" id="ctl-ime">
      <label>お題<select id="selIme">
        <option value="prompt">AIプロンプト</option><option value="daily">日常・連絡</option><option value="custom">自作(1行=1問)</option></select></label>
    </div>
    <div class="controls" id="ctl-weak"><span id="weakInfo"></span></div>
    <div class="controls" id="ctl-common">
      <label id="lblLen">長さ<select id="selLen"><option value="s">短め</option><option value="n">標準</option><option value="l">長め</option></select></label>
      <label class="chk" id="lblSkip"><input type="checkbox" id="optSkip"> ミスしても先に進む</label>
      <label class="chk" id="lblRetry"><input type="checkbox" id="optRetry"> ミスした行をもう一度出す</label>
      <label class="chk"><input type="checkbox" id="optSound"> 打鍵音・効果音</label>
    </div>
    <div id="customBox" hidden>
      <textarea id="customText" spellcheck="false" placeholder=""></textarea>
      <div class="btns"><button class="btn primary" id="customApply">このテキストで練習</button></div>
    </div>

    <div class="stage" id="stage" tabindex="0">
      <div class="hud">
        <span>問題 <b id="hNum">1/3</b></span>
        <span>速度 <b id="hSpd">0</b><i id="hUnit">打/分</i></span>
        <span>正確率 <b id="hAcc">-</b></span>
        <span>時間 <b id="hTime">0:00</b></span>
      </div>
      <div class="bar"><i id="prog"></i></div>
      <div id="warn" class="warn" hidden>IMEがオンになっています。半角英数に切り替えてください(半角/全角キー)。</div>
      <div id="body"></div>
      <div id="imeWrap" hidden><input id="imeInput" autocomplete="off" spellcheck="false" placeholder="ここに入力(IMEで変換してOK)"></div>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <section id="rec" class="rec" hidden>
    <div class="rec-grid">
      <div class="sec">
        <div class="sec-h"><h2>速度の推移</h2>
          <span><select id="selHist"><option value="code">コード</option><option value="roma">ローマ字</option><option value="ime">IME変換</option><option value="weak">苦手特訓</option></select>
          <select id="selGran"><option value="run">回ごと</option><option value="day">日ごと</option><option value="all">全期間</option></select></span></div>
        <div id="chart" class="chart"></div>
      </div>
      <div class="sec">
        <div class="sec-h"><h2>苦手キー</h2><span class="hint">ミス率と反応の遅さから計算</span></div>
        <div id="weakList" class="weak-list"></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2 id="kbTitle">キーごとのミス率</h2>
        <span><select id="selKb"><option value="miss">ミス率</option><option value="speed">反応速度</option></select>
        <select id="selLayout"><option value="jis">JIS配列</option><option value="us">US配列</option></select></span></div>
      <div class="kb-wrap"><div id="kb" class="kb"></div></div>
      <div id="kbInfo" class="hint">キーにカーソルを合わせると詳細が出ます。点線のキーはまだデータが少ないキーです。</div>
    </div>
    <div class="sec">
      <h2>最近の記録</h2>
      <div class="tbl"><table id="histTbl"></table></div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>記録の持ち運び</h2><span class="hint">ローカル版とWeb公開版は記録が別々です。ファイル経由で移せます。</span></div>
      <div class="btns">
        <button class="btn" id="expBtn">記録を書き出す(.json)</button>
        <button class="btn" id="impBtn">記録を読み込む</button>
        <input type="file" id="impFile" accept=".json,application/json" hidden>
      </div>
      <div class="hint" id="ioMsg" role="status"></div>
    </div>
    <div class="btns"><button class="btn danger" id="resetBtn">記録をリセット</button></div>
  </section>
</div>

<dialog id="authDlg" aria-labelledby="authTitle">
  <form id="authForm" autocomplete="on">
    <h2 id="authTitle">ログイン</h2>
    <div class="seg" role="group" aria-label="操作の選択">
      <button type="button" data-k="login" aria-pressed="true">ログイン</button>
      <button type="button" data-k="register" aria-pressed="false">新規登録</button>
    </div>
    <label class="fld">ユーザー名<input type="text" id="auUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required></label>
    <label class="fld">パスワード<input type="password" id="auPass" name="password" autocomplete="current-password" maxlength="128" required></label>
    <label class="chk" style="margin-bottom:10px;font-size:13px"><input type="checkbox" id="auShow"> パスワードを表示</label>
    <div class="captcha" id="auCaptcha" hidden></div>
    <p class="dlg-note" id="auNote"></p>
    <div class="dlg-msg" id="auMsg" role="alert"></div>
    <div class="btns" style="justify-content:flex-end">
      <button type="button" class="btn" id="auCancel">キャンセル</button>
      <button type="submit" class="btn primary" id="auSubmit">ログイン</button>
    </div>
  </form>
</dialog>

<script type="text/plain" id="data">

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STORE = 'dakendojo-v1';
const HIST_MAX = 20000;
function loadDB(){ try { return JSON.parse(localStorage.getItem(STORE)); } catch(e){ return null; } }
function saveDB(){ try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch(e){} }
let DB = Object.assign({keys:{}, history:[], customCode:'', customIme:'', layout:'jis', kbMode:'miss', account:null, kd:{}, cursor:0, prefsAt:0, prefsSynced:0}, loadDB() || {});
DB.settings = Object.assign({skip:false, len:'n', sound:false, retry:true}, DB.settings);

/* ---------- data ---------- */
const blocks = {};
$('#data').textContent.split(/^@@/m).forEach(b => {
  if (!b.trim()) return;
  const nl = b.indexOf('\n');
  const tag = b.slice(0, nl).trim();
  const body = b.slice(nl + 1).replace(/\s+$/, '');
  (blocks[tag] = blocks[tag] || []).push(body);
});
const pairs = tag => blocks[tag][0].split('\n').filter(Boolean).map(l => l.split('|'));
const JP = { prompt: pairs('prompt'), daily: pairs('daily') };
const POOL = blocks.pool[0].split(/\s+/).filter(Boolean);

function normCode(s){
  return s.replace(/\r/g,'').replace(/\t/g,'    ').split('\n').map(l => l.replace(/\s+$/,'')).join('\n').replace(/^\n+|\n+$/g,'');
}
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pick = (a,n) => shuffle(a).slice(0,n);
const LEN = {code:{s:1,n:3,l:6}, sym:{s:4,n:8,l:16}, jp:{s:4,n:8,l:16}, chunk:{s:5,n:10,l:20}};
const lenOf = k => LEN[k][DB.settings.len] || LEN[k].n;

/* ---------- romaji engine ---------- */
const K1 = {}, K2 = {};
function def(target, str){ str.trim().split(/\s+/).forEach(p => { const [k,v] = p.split('='); target[k] = v.split('|'); }); }
def(K1, `あ=a い=i う=u|wu|whu え=e お=o か=ka|ca き=ki く=ku|cu|qu け=ke こ=ko|co さ=sa し=shi|si|ci す=su せ=se|ce そ=so
た=ta ち=chi|ti つ=tsu|tu て=te と=to な=na に=ni ぬ=nu ね=ne の=no は=ha ひ=hi ふ=fu|hu へ=he ほ=ho
ま=ma み=mi む=mu め=me も=mo や=ya ゆ=yu よ=yo ら=ra り=ri る=ru れ=re ろ=ro わ=wa を=wo
が=ga ぎ=gi ぐ=gu げ=ge ご=go ざ=za じ=ji|zi ず=zu ぜ=ze ぞ=zo だ=da ぢ=di づ=du で=de ど=do
ば=ba び=bi ぶ=bu べ=be ぼ=bo ぱ=pa ぴ=pi ぷ=pu ぺ=pe ぽ=po
ぁ=la|xa ぃ=li|xi|lyi|xyi ぅ=lu|xu ぇ=le|xe|lye|xye ぉ=lo|xo ゃ=lya|xya ゅ=lyu|xyu ょ=lyo|xyo ゎ=lwa|xwa ゔ=vu`);
const yRows = {き:['ky'],ぎ:['gy'],に:['ny'],ひ:['hy'],び:['by'],ぴ:['py'],み:['my'],り:['ry'],ぢ:['dy'],
  し:['sh','sy'],じ:['j','zy','jy'],ち:['ch','cy','ty']};
for (const [k,ps] of Object.entries(yRows)) {
  [['ゃ','a'],['ゅ','u'],['ょ','o'],['ぇ','e']].forEach(([s,v]) => { K2[k+s] = ps.map(p => p+v); });
}
def(K2, `てぃ=thi でぃ=dhi でゅ=dhu ふぁ=fa ふぃ=fi ふぇ=fe ふぉ=fo ふゅ=fyu うぃ=wi|whi うぇ=we|whe うぉ=who
つぁ=tsa とぅ=twu どぅ=dwu ゔぁ=va ゔぃ=vi ゔぇ=ve ゔぉ=vo`);
const SMALL = 'ぁぃぅぇぉゃゅょゎ';
const PUNCT = {'、':',','。':'.','ー':'-','「':'[','」':']','『':'[','』':']','・':'/','〜':'~','～':'~'};
const SOKU = ['xtu','ltu','xtsu','ltsu'];

function tokenize(reading){
  const src = reading.normalize('NFKC');
  const s = src.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const u = [];
  for (let i = 0; i < s.length;) {
    const c = s[i], two = s.slice(i, i+2);
    if (c === 'っ') { u.push({o:src[i], sok:true}); i++; continue; }
    if (c === 'ん') { u.push({o:src[i], n:true}); i++; continue; }
    if (two.length === 2 && (K2[two] || (K1[c] && SMALL.includes(s[i+1]) && K1[s[i+1]]))) {
      const prod = (K1[c]||[]).flatMap(a => (K1[s[i+1]]||[]).map(b => a+b));
      u.push({o:src.slice(i,i+2), kana:true, cands:[...new Set([...(K2[two]||[]), ...prod])]}); i += 2; continue;
    }
    if (K1[c]) u.push({o:src[i], kana:true, cands:K1[c].slice()});
    else if (PUNCT[c]) u.push({o:src[i], cands:[PUNCT[c]]});
    else u.push({o:src[i], cands:[c.toLowerCase()]});
    i++;
  }
  // っ: merge with following kana
  const out = [];
  for (let i = 0; i < u.length; i++) {
    const x = u[i];
    if (x.sok) {
      const nx = u[i+1];
      if (nx && nx.kana) {
        const dbl = nx.cands.filter(r => /^[bcdfghjkmpqrstvwxyz]/.test(r)).map(r => r[0] + r);
        out.push({o:x.o + nx.o, kana:true, cands:[...new Set([...dbl, ...SOKU.flatMap(p => nx.cands.map(r => p + r))])]});
        i++;
      } else out.push({o:x.o, cands:SOKU.slice()});
    } else out.push(x);
  }
  // ん
  out.forEach((x, i) => {
    if (!x.n) return;
    const nx = out[i+1];
    const single = nx && !nx.n && nx.cands.every(r => !/^[aiueony']/.test(r));
    x.cands = single ? ['n','nn','xn'] : ['nn','xn'];
  });
  return out;
}

/* ---------- state ---------- */
let mode = 'code', view = 'play';
const sub = {code:'cs', roma:'prompt', ime:'prompt'};
let S = null;
const cur = () => S.items[S.idx];

function buildItems(){
  if (mode === 'code') {
    const l = sub.code;
    if (l === 'custom') {
      const t = normCode(DB.customCode || '');
      if (!t) return [{type:'code', text:'// 上の欄に自分のコードを貼り付けて「このテキストで練習」を押してください'}];
      const lines = t.split('\n'), chunks = [];
      const cl = lenOf('chunk'); for (let i = 0; i < lines.length; i += cl) { const c = normCode(lines.slice(i, i+cl).join('\n')); if (c) chunks.push(c); }
      return chunks.map(text => ({type:'code', text}));
    }
    if (l === 'sym') return pick(blocks.sym[0].split('\n').filter(Boolean), lenOf('sym')).map(text => ({type:'code', text}));
    return pick(blocks[l], lenOf('code')).map(t => ({type:'code', text:normCode(t)}));
  }
  if (mode === 'roma') {
    const src = sub.roma === 'mix' ? JP.prompt.concat(JP.daily) : JP[sub.roma];
    return pick(src, lenOf('jp')).map(([text, reading]) => ({type:'roma', text, reading}));
  }
  if (mode === 'ime') {
    if (sub.ime === 'custom') {
      const ls = (DB.customIme || '').split('\n').map(l => l.trim()).filter(Boolean);
      if (!ls.length) return [{type:'ime', text:'上の欄に練習したい文章を1行ずつ入れてください。'}];
      return ls.map(text => ({type:'ime', text}));
    }
    return pick(JP[sub.ime], lenOf('jp')).map(([text]) => ({type:'ime', text}));
  }
  return genWeak();
}

function weakKeys(n){
  const all = Object.entries(DB.keys);
  let tl = 0, tc = 0; all.forEach(([,v]) => { tl += v.t; tc += v.c; });
  const avg = tc ? tl / tc : 0;
  return all.filter(([k,v]) => v.n >= 8 && k !== ' ' && k !== '⏎')
    .map(([k,v]) => {
      const rate = v.m / v.n, ms = v.c ? v.t / v.c : 0;
      return {k, rate, ms, n:v.n, score: rate * 4 + (avg && ms ? ms / avg - 1 : 0)};
    })
    .filter(x => x.score > 0.15).sort((a,b) => b.score - a.score).slice(0, n);
}
function genWeak(){
  const wk = weakKeys(6).map(w => w.k);
  const w = tok => { if (!wk.length) return 1; let c = 0; for (const ch of tok.toLowerCase()) if (wk.includes(ch)) c++; return 0.2 + c * 1.5; };
  const weights = POOL.map(w), total = weights.reduce((a,b) => a+b, 0);
  const draw = () => { let r = Math.random() * total; for (let i = 0; i < POOL.length; i++) { r -= weights[i]; if (r <= 0) return POOL[i]; } return POOL[0]; };
  const items = [];
  for (let i = 0, n = lenOf('jp'); i < n; i++) {
    const toks = []; let len = 0;
    while (len < 34) { const t = draw(); toks.push(t); len += t.length + 1; }
    items.push({type:'code', text:toks.join(' ')});
  }
  return items;
}

function newSession(){
  S = {items:buildItems(), idx:0, start:0, end:0, correct:0, miss:0, lastT:0, missKeys:{}, finished:false};
  loadItem();
  render();
}
function loadItem(){
  const it = cur();
  if (it.type === 'code') { it.pos = 0; it.bad = null; }
  if (it.type === 'roma') { it.units = tokenize(it.reading); it.ui = 0; it.buf = ''; }
  if (it.type === 'ime') { it.prev = ''; const inp = $('#imeInput'); inp.value = ''; }
}

/* ---------- sound ---------- */
let AC = null;
function tone(freq, dur, type, vol, delay){
  if (!DB.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch(e){}
}
const sfx = {
  hit(){ tone(1100 + Math.random() * 120, 0.04, 'square', 0.035); },
  miss(){ tone(150, 0.14, 'sawtooth', 0.07); },
  item(){ tone(880, 0.08, 'triangle', 0.08); },
  done(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.09, i * 0.09)); }
};

/* ---------- key stats ---------- */
function keyName(ch){ return ch === '\n' ? '⏎' : ch.toLowerCase(); }
function rec(ch, ok, lat){
  if (ch == null) return;
  const k = keyName(ch);
  const v = DB.keys[k] || (DB.keys[k] = {n:0, m:0, t:0, c:0});
  v.n++;
  if (!ok) v.m++;
  else if (lat != null && lat < 2000) { v.t += lat; v.c++; }
  if (DB.account) {
    const d = DB.kd[k] || (DB.kd[k] = {n:0, m:0, t:0, c:0});
    d.n++;
    if (!ok) d.m++;
    else if (lat != null && lat < 2000) { d.t += lat; d.c++; }
  }
}
function hit(ch){
  const now = performance.now();
  const lat = S.correct > 0 ? now - S.lastT : null;
  S.lastT = now; S.correct++;
  rec(ch, true, lat); sfx.hit();
}
function miss(ch){
  S.miss++;
  const mi = S.items[S.idx];
  if (mi) {
    mi.missN = (mi.missN || 0) + 1;
    if (mi.type === 'code') (mi.missLines = mi.missLines || new Set()).add(mi.text.slice(0, mi.pos).split('\n').length - 1);
  }
  if (ch != null) { const k = keyName(ch); S.missKeys[k] = (S.missKeys[k] || 0) + 1; }
  rec(ch, false); sfx.miss();
  const b = $('#body'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
  clearTimeout(miss.t); miss.t = setTimeout(() => b.classList.remove('flash'), 160);
}

/* ---------- code typing ---------- */
const opt = { indent:true, guide:true, get skip(){ return DB.settings.skip; }, get retry(){ return DB.settings.retry; } };
function codeKey(k){
  const it = cur(), t = it.text, exp = t[it.pos];
  const skipOn = () => { (it.bad = it.bad || new Set()).add(it.pos); it.pos++; if (exp === '\n' && opt.indent) while (t[it.pos] === ' ') it.pos++; };
  if (k === '\t') {
    if (exp === ' ') { let c = 0; while (t[it.pos] === ' ' && c < 4) { it.pos++; c++; } hit(' '); }
    else { miss(exp); if (opt.skip) skipOn(); }
  } else if (k === exp) {
    it.pos++; hit(exp);
    if (exp === '\n' && opt.indent) while (t[it.pos] === ' ') it.pos++;
  } else { miss(exp); if (opt.skip) skipOn(); }
  if (it.pos >= t.length) nextItem();
}

/* ---------- romaji typing ---------- */
function step(it, k){
  const u = it.units[it.ui]; if (!u) return false;
  const nb = it.buf + k, m = u.cands.filter(r => r.startsWith(nb));
  if (m.length) {
    it.buf = nb;
    if (m.length === 1 && m[0] === nb) { u.typed = nb; it.ui++; it.buf = ''; }
    return true;
  }
  if (it.buf && u.cands.includes(it.buf)) { u.typed = it.buf; it.ui++; it.buf = ''; return step(it, k); }
  return false;
}
function expectChar(it){
  const u = it.units[it.ui]; if (!u) return null;
  const c = u.cands.find(r => r.startsWith(it.buf)) || u.cands[0];
  if (c.length === it.buf.length) { const nx = it.units[it.ui + 1]; return nx ? nx.cands[0][0] : null; }

  const exp = expectChar(it);

const nfkc = s => s.normalize('NFKC');
let composing = false;
function imeCheck(){
  if (view !== 'play' || !S || S.finished || mode !== 'ime') return;
  const it = cur(), inp = $('#imeInput');
  const v = nfkc(inp.value), t = nfkc(it.text);
  if (!S.start) { S.start = performance.now(); }
  const prev = it.prev || '';
  let p = 0; while (p < prev.length && p < v.length && prev[p] === v[p]) p++;
  for (let i = p; i < v.length; i++) if (v[i] !== t[i]) { S.miss++; sfx.miss(); const k = v[i]; S.missKeys[k] = (S.missKeys[k]||0) + 1; }
  it.prev = v;
  if (v.replace(/\s+$/,'') === t) { S.correct += t.length; nextItem(); }

}

/* ---------- flow ---------- */
function dedent(lines){
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length), Infinity);
  return ind && ind !== Infinity ? lines.map(l => l.slice(ind)) : lines;
}
function queueRetry(it){
  if (!opt.retry || it.retry || !it.missN || mode === 'ime') return;
  if (it.type === 'code') {
    const all = it.text.split('\n');
    const lines = dedent([...it.missLines].sort((a, b) => a - b).map(i => all[i]).filter(l => l && l.trim()));
    if (lines.length) S.items.push({type:'code', text:lines.join('\n'), retry:true});
  } else if (it.type === 'roma') S.items.push({type:'roma', text:it.text, reading:it.reading, retry:true});
}
function nextItem(){
  queueRetry(cur());
  S.idx++;

  sfx.item();
  loadItem();
}
function speed(){
  if (!S.start) return 0;
  const ms = (S.end || performance.now()) - S.start;

}
function accuracy(){ const n = S.correct + S.miss; return n ? S.correct / n : null; }
function modeKey(){ return mode === 'weak' ? 'weak' : mode + ':' + sub[mode]; }
const MODE_LABEL = {'code:cs':'コード C#','code:py':'コード Python','code:js':'コード JS','code:sym':'記号ラッシュ','code:custom':'自作コード',
  'roma:prompt':'ローマ字 プロンプト','roma:daily':'ローマ字 日常','roma:mix':'ローマ字 ミックス',
  'ime:prompt':'IME プロンプト','ime:daily':'IME 日常','ime:custom':'IME 自作','weak':'苦手特訓'};
function rankOf(spd, ime){
  const th = ime ? [60,100,140,180] : [150,250,350,450];
  const names = ['見習い','初段','二段','三段','師範'];
  let i = 0; while (i < th.length && spd >= th[i]) i++;
  return names[i];
}
function finish(){
  S.end = performance.now(); S.finished = true; sfx.done();

    DB.history.push({t:Date.now(), mode:modeKey(), spd:Math.round(speed()), acc:accuracy() ?? 1, sec:Math.round((S.end - S.start)/1000), miss:S.miss, ...(DB.account ? {u:true} : {})});
    if (DB.history.length > HIST_MAX) DB.history = DB.history.slice(-HIST_MAX);
    saveDB(); scheduleSync();

}

/* 履歴を日/週/月ごとに平均する。weekは月曜始まり */
function aggregate(data, kind, g){
  const groups = new Map();
  data.forEach(h => {
    const d = new Date(h.t);
    let start;
    if (kind === 'month') start = new Date(d.getFullYear(), d.getMonth(), 1);
    else if (kind === 'week') start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7);
    else start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const k = start.getTime(), e = groups.get(k) || {t:k, sp:0, ac:0, n:0};
    e.sp += h.spd; e.ac += h.acc; e.n++; groups.set(k, e);
  });
  return [...groups.values()].sort((a, b) => a.t - b.t).map(e => {
    const d = new Date(e.t);
    const label = kind === 'month' ? `${d.getFullYear()}/${d.getMonth()+1}` : kind === 'week' ? `${d.getMonth()+1}/${d.getDate()}の週` : `${d.getMonth()+1}/${d.getDate()}`;
    return {t:e.t, spd:Math.round(e.sp / e.n), acc:e.ac / e.n, n:e.n, mode:g, label};
  });
}

  if (agg && data.length) {
    let kind = 'day';
    if (gran === 'all') { const span = (data[data.length-1].t - data[0].t) / 86400000; kind = span <= 60 ? 'day' : span <= 366 ? 'week' : 'month'; }
    data = aggregate(data, kind, g);
  }
  if (gran !== 'all') data = data.slice(-30);
  const unit = g === 'ime' ? '字/分' : '打/分';
  if (!data.length) { box.innerHTML = `<div class="empty">このモードの記録はまだありません。1回練習するとグラフが表示されます。</div>`; return; }
  const W = Math.max(300, box.clientWidth || 560), H = 220, ml = 40, mr = 18, mt = 14, mb = 28;
  const max = Math.max(...data.map(d => d.spd), 10);
  const raw = max * 1.15 / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))); const stepC = [1,2,2.5,5,10].find(m => m * mag >= raw) * mag;
  const yMax = Math.ceil(max * 1.15 / stepC) * stepC;
  const x = i => data.length === 1 ? ml + (W - ml - mr) / 2 : ml + i * (W - ml - mr) / (data.length - 1);
  const y = v => mt + (H - mt - mb) * (1 - v / yMax);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="速度の推移">`;
  for (let v = 0; v <= yMax; v += stepC) {
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v ? 'stroke-dasharray="2 4"' : ''}/>`;
    s += `<text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  const pts = data.map((d, i) => [x(i), y(d.spd)]);
  if (data.length > 1) {
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    s += `<path d="${line} L${pts[pts.length-1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z" fill="var(--accent)" fill-opacity="0.12"/>`;
    s += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const last = pts[pts.length - 1];
  s += `<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;
  s += `<text x="${Math.min(last[0], W - mr - 4)}" y="${last[1] - 10}" text-anchor="end" style="fill:var(--ink)">${data[data.length-1].spd} ${unit}</text>`;
  const yr = data.length > 1 && new Date(data[0].t).getFullYear() !== new Date(data[data.length-1].t).getFullYear();
  const dlab = t => { const d = new Date(t); return (yr ? d.getFullYear() + '/' : '') + (d.getMonth()+1) + '/' + d.getDate(); };
  s += `<text x="${x(0)}" y="${H - 8}" text-anchor="${data.length === 1 ? 'middle' : 'start'}">${dlab(data[0].t)}</text>`;
  if (data.length > 1) s += `<text x="${x(data.length-1)}" y="${H - 8}" text-anchor="end">${dlab(data[data.length-1].t)}</text>`;
  s += `<line id="cx" x1="0" x2="0" y1="${mt}" y2="${H - mb}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  s += `<circle id="cdot" r="5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>`;
  s += `<rect x="${ml}" y="0" width="${W - ml - mr}" height="${H}" fill="transparent" id="hov"/></svg><div class="tip" id="tip" hidden></div>`;
  box.innerHTML = s;
  const hov = box.querySelector('#hov'), tip = box.querySelector('#tip'), cx = box.querySelector('#cx'), cd = box.querySelector('#cdot');
  const svg = box.querySelector('svg');
  hov.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
    let i = data.length === 1 ? 0 : Math.round((sx - ml) / ((W - ml - mr) / (data.length - 1)));
    i = Math.max(0, Math.min(data.length - 1, i));
    const d = data[i], px = x(i), py = y(d.spd);
    cx.setAttribute('x1', px); cx.setAttribute('x2', px); cx.setAttribute('visibility', 'visible');
    cd.setAttribute('cx', px); cd.setAttribute('cy', py); cd.setAttribute('visibility', 'visible');
    const dt = new Date(d.t);
    tip.innerHTML = agg
      ? `${d.label} ・ ${d.n}回の平均<br><b>${d.spd}</b> ${unit} ・ 正確率 ${(d.acc*100).toFixed(1)}%`
      : `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')} ・ ${esc(MODE_LABEL[d.mode] || d.mode)}<br><b>${d.spd}</b> ${unit} ・ 正確率 ${(d.acc*100).toFixed(1)}%`;
    tip.hidden = false;
    const scale = r.width / W;
    let left = px * scale + 12; if (left + tip.offsetWidth > r.width) left = px * scale - tip.offsetWidth - 12;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = Math.max(0, py * scale - 30) + 'px';
  });
  hov.addEventListener('mouseleave', () => { tip.hidden = true; cx.setAttribute('visibility','hidden'); cd.setAttribute('visibility','hidden'); });
}

/* ---------- account / cloud sync ---------- */
const ACC = {avail:false, loggedIn:false, user:null, syncing:false, at:0, err:'', mode:'login'};
let syncTimer = 0, syncPromise = null, syncAgain = false;

async function post(path, body){
  const r = await fetch(path, {method: body === undefined ? 'GET' : 'POST', headers:{'Content-Type':'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)});
  let data = null; try { data = await r.json(); } catch(_){}
  return {ok:r.ok, status:r.status, data:data || {}};
}
function touchPrefs(){ DB.prefsAt = Date.now(); saveDB(); scheduleSync(); }
const prefsData = () => ({settings:DB.settings, layout:DB.layout, kbMode:DB.kbMode, customCode:DB.customCode, customIme:DB.customIme});
function applyPrefs(p){
  const d = p.data || {};
  DB.settings = Object.assign({skip:false, len:'n', sound:false, retry:true}, d.settings);
  if (d.layout === 'jis' || d.layout === 'us') DB.layout = d.layout;
  if (d.kbMode === 'miss' || d.kbMode === 'speed') DB.kbMode = d.kbMode;
  if (typeof d.customCode === 'string') DB.customCode = d.customCode;
  if (typeof d.customIme === 'string') DB.customIme = d.customIme;
  DB.prefsAt = DB.prefsSynced = p.updatedAt;
  $('#optSkip').checked = DB.settings.skip; $('#selLen').value = DB.settings.len;
  $('#optSound').checked = DB.settings.sound; $('#optRetry').checked = DB.settings.retry;
  if (view === 'rec') renderRecords(); else updateCustomBox();
}
function clearLocal(){
  DB.keys = {}; DB.history = []; DB.kd = {}; DB.cursor = 0; DB.customCode = ''; DB.customIme = ''; saveDB();
}
function mergeDelta(into, from){
  Object.entries(from).forEach(([k, v]) => { const x = into[k] || (into[k] = {n:0, m:0, t:0, c:0}); x.n += v.n; x.m += v.m; x.t += v.t; x.c += v.c; });
}

function scheduleSync(ms){
  if (!ACC.loggedIn) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms == null ? 2000 : ms);
}
function syncNow(){
  if (!ACC.loggedIn) return Promise.resolve();
  if (syncPromise) { syncAgain = true; return syncPromise; }
  syncPromise = (async () => {
    ACC.syncing = true; ACC.err = ''; renderAcct();
    try {
      let first = true;
      for (let guard = 0; guard < 20; guard++) {
        const sentRuns = first ? DB.history.filter(h => h.u).slice(0, 5000) : [];
        const sentKd = first ? DB.kd : {};
        if (first) DB.kd = {};
        const prefs = first && DB.prefsAt > DB.prefsSynced ? {updatedAt:DB.prefsAt, data:prefsData()} : null;
        let r;
        try {
          r = await post('/api/sync', {after:DB.cursor, runs:sentRuns.map(({u, ...h}) => h), kd:sentKd, prefs});
        } catch (e) { mergeDelta(DB.kd, sentKd); throw e; }
        if (!r.ok) { mergeDelta(DB.kd, sentKd); const e = new Error('http ' + r.status); e.status = r.status; throw e; }
        first = false;
        const d = r.data, have = new Set(DB.history.map(h => h.t + '|' + h.mode));
        (d.runs || []).forEach(x => { const k = x.t + '|' + x.mode; if (!have.has(k)) { have.add(k); DB.history.push(x); } });
        sentRuns.forEach(h => { delete h.u; });
        DB.history.sort((a, b) => a.t - b.t);
        if (DB.history.length > HIST_MAX) DB.history = DB.history.slice(-HIST_MAX);
        DB.cursor = d.cursor || DB.cursor;
        DB.keys = d.keys || {};
        mergeDelta(DB.keys, DB.kd);
        if (prefs) DB.prefsSynced = prefs.updatedAt;
        if (d.prefs && d.prefs.updatedAt > DB.prefsAt) applyPrefs(d.prefs);
        saveDB();
        const leftover = DB.history.some(h => h.u);
        if (!d.more && !leftover) break;
        if (!d.more && leftover) first = true; // 未送信が5000件を超えた分を続けて送る
      }
      ACC.at = Date.now();
      if (view === 'rec') renderRecords();
    } catch (e) {
      if (e.status === 401) { ACC.loggedIn = false; ACC.err = 'ログインの期限が切れました。もう一度ログインしてください。'; }
      else if (e.status === 429) { ACC.err = '同期の回数が多すぎます。少し待ってから自動で再試行します。'; scheduleSync(65000); }
      else ACC.err = '同期できませんでした。通信が戻ったら自動で再送します。';
    } finally {
      ACC.syncing = false; syncPromise = null; renderAcct();
      if (syncAgain) { syncAgain = false; scheduleSync(500); }
    }
  })();
  return syncPromise;
}

const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };

/* ログイン後の端末データの扱い: 別アカウントの記録が残っていたら確認、初めてのアカウントならこの端末の記録を取り込む */
function adopt(user){
  if (DB.account && DB.account !== user) {
    if (!confirm(`この端末には「${DB.account}」の記録が残っています。\n消してから「${user}」でログインしますか?\n(「${DB.account}」の記録はクラウドに残っています)`)) return false;
    clearLocal(); DB.account = null; DB.prefsAt = DB.prefsSynced = 0;
  }
  if (DB.account !== user) {
    DB.account = user; DB.cursor = 0;
    DB.kd = JSON.parse(JSON.stringify(DB.keys));

    const r = await post('/api/' + ACC.mode, payload);
    if (!r.ok) {
      msg.textContent = r.data.message || (r.status === 503 ? 'サーバーの設定がまだ終わっていません。' : 'うまくいきませんでした。もう一度お試しください。');
      return;
    }
    if (!adopt(r.data.username)) { try { await post('/api/logout', {}); } catch(_){} ACC.loggedIn = false; msg.textContent = 'ログインを取り消しました。'; return; }
    closeAuth(); renderAcct(); syncNow();
  } catch (_) {
    msg.textContent = '通信に失敗しました。ネットワークを確認してください。';
  } finally { if (ACC.mode === 'register') resetCaptcha(); btn.disabled = false; captchaUpdate(); }
});

async function initAccount(){
  if (location.protocol === 'file:') return;
  try {
    const r = await post('/api/me');
    if (r.status !== 200 && r.status !== 401) return; // APIがない/未設定のときはログイン機能を隠す
    ACC.avail = true;
    if (r.status === 200) {
      if (adopt(r.data.username)) syncNow();
      else { try { await post('/api/logout', {}); } catch(_){} }
    }
    renderAcct();
  } catch (_) {
    // オフライン: すでにアカウントが紐づいていれば表示だけ出す
    if (DB.account) { ACC.avail = true; ACC.user = DB.account; ACC.err = 'オフラインです。つながったら同期します。'; renderAcct(); }
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && ACC.loggedIn && Date.now() - ACC.at > 30000) syncNow(); });
window.addEventListener('online', () => { if (ACC.loggedIn) scheduleSync(500); else if (DB.account) initAccount(); });

setMode('code');
initAccount();
})();
</script>
